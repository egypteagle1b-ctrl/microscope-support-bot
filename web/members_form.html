<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MICROSCOPE TEAM — تسجيل بيانات الأعضاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-deep:#000000;
  --bg:#070a14;
  --surface:rgba(15,23,42,0.65);
  --primary:#3b82f6;
  --accent:#0ea5e9;
  --border-blue:rgba(59,130,246,0.3);
  --text:#ffffff;
  --dim:#94a3b8;
  --muted:#475569;
  --r:20px;
  --font-ar:'Cairo',sans-serif;
  --font-en:'Outfit',sans-serif;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-ar);
  background:var(--bg-deep);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  padding: 60px 20px;
  overflow-x:hidden;
}
.bg-canvas{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg);}
.bg-orb{position:absolute;border-radius:50%;filter:blur(140px);opacity:0.25;animation:floatOrb 18s ease-in-out infinite}
.orb1{width:700px;height:700px;background:#3b82f6;top:-250px;right:-200px}
.orb2{width:600px;height:600px;background:#0ea5e9;bottom:-200px;left:-150px;animation-delay:-9s;opacity:0.2}
@keyframes floatOrb{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(50px,-60px) scale(1.1)}
  66%{transform:translate(-40px,50px) scale(0.9)}
}
.grid-lines{
  position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
}

.header-container {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-bottom: 50px;
  animation: fadeInDown 1s ease-out;
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-30px); }
  to { opacity: 1; transform: translateY(0); }
}
.brand-title {
  font-family: var(--font-en);
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 15px;
  background: linear-gradient(135deg, #ffffff 0%, #93c5fd 50%, #38bdf8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-transform: uppercase;
  filter: drop-shadow(0 0 30px rgba(59,130,246,0.5));
}
.subtitle {
  color: var(--dim);
  font-size: 1.25rem;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.form-card {
  position: relative;
  z-index: 2;
  background:var(--surface);
  border:1px solid var(--border-blue);
  border-radius:var(--r);
  padding:50px;
  width:100%;
  max-width:850px;
  box-shadow:0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  animation:fadeInUp 1s ease-out 0.2s both;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}
.form-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,transparent,var(--primary),var(--accent),transparent);
  border-radius: var(--r) var(--r) 0 0;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.form-group.full-width {
  grid-column: 1 / -1;
}
label {
  font-weight: 600;
  color: #e2e8f0;
  font-size: 1rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
label .req {
  color: #f43f5e;
  font-weight: bold;
}
input, select {
  background:rgba(0,0,0,0.4);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  padding:18px 22px;
  color:var(--text);
  font-family:var(--font-ar);
  font-size:1.1rem;
  outline:none;
  transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  box-shadow:inset 0 2px 4px rgba(0,0,0,0.3);
}
input[type="date"] {
  font-family: var(--font-en);
}
input:focus, select:focus {
  border-color:var(--accent);
  background:rgba(0,0,0,0.6);
  box-shadow:0 0 0 4px rgba(14,165,233,0.2), inset 0 2px 4px rgba(0,0,0,0.3);
  transform:translateY(-2px);
}
select option {
  background: #0f172a;
  color: #ffffff;
}
input::placeholder {
  color: var(--muted);
}
input[type="file"] {
  padding: 12px;
  cursor: pointer;
}
input[type="file"]::file-selector-button {
  background: rgba(59,130,246,0.2);
  border: 1px solid rgba(59,130,246,0.5);
  color: #fff;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-ar);
  margin-left: 15px;
}
input[type="file"]::file-selector-button:hover {
  background: rgba(59,130,246,0.4);
}

.btn-submit {
  grid-column: 1 / -1;
  margin-top: 30px;
  padding:20px 32px;
  border-radius:20px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;
  border:none;
  font-family:var(--font-ar);
  font-size:1.3rem;
  font-weight:900;
  cursor:pointer;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 15px 40px rgba(59,130,246,0.5), inset 0 2px 5px rgba(255,255,255,0.2);
  position:relative;
  overflow:hidden;
  text-transform:uppercase;
  letter-spacing:0.05em;
}
.btn-submit::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transition: all 0.6s;
}
.btn-submit:hover {
  transform:translateY(-5px) scale(1.02);
  box-shadow:0 20px 50px rgba(14,165,233,0.6), inset 0 2px 5px rgba(255,255,255,0.3);
}
.btn-submit:hover::after {
  left: 200%;
}

/* File Dropzone */
.file-dropzone {
  border: 2px dashed rgba(59,130,246,0.4);
  border-radius: 18px;
  padding: 24px 16px;
  text-align: center;
  background: rgba(15,23,42,0.4);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}
.file-dropzone:hover {
  border-color: var(--accent);
  background: rgba(14,165,233,0.08);
}
.upload-icon {
  font-size: 2.4rem;
  display: block;
  margin-bottom: 8px;
  filter: drop-shadow(0 0 10px rgba(14,165,233,0.5));
}
.upload-text {
  font-weight: 700;
  color: #e2e8f0;
  font-size: 1rem;
  margin-bottom: 4px;
}
.upload-hint {
  font-size: 0.8rem;
  color: var(--dim);
}
.upload-preview-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.upload-preview-box img {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--accent);
  box-shadow: 0 0 20px rgba(14,165,233,0.5);
}
.btn-change-photo {
  background: rgba(255,255,255,0.08);
  border: 1px solid var(--border-blue);
  color: #e0f2fe;
  padding: 6px 14px;
  border-radius: 10px;
  font-size: 0.85rem;
  font-family: var(--font-ar);
  cursor: pointer;
}

@media(max-width: 768px) {
  body {
    padding: 30px 12px 60px;
  }
  .form-grid {
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .form-card {
    padding: 24px 16px;
    border-radius: 18px;
  }
  .brand-title {
    font-size: clamp(2rem, 7vw, 3rem);
  }
  .subtitle {
    font-size: 1rem;
  }
  input, select {
    font-size: 16px !important; /* Prevents auto zoom on iOS */
    padding: 14px 16px;
    border-radius: 12px;
  }
  .btn-submit {
    padding: 16px 20px;
    font-size: 1.15rem;
    border-radius: 14px;
  }
  .toast-bar {
    right: 12px;
    left: 12px;
    bottom: 20px;
    justify-content: center;
    font-size: 0.95rem;
    padding: 12px 16px;
  }
}

/* Toast */
.toast-bar{
  position:fixed;bottom:30px;right:30px;
  background:rgba(15,23,42,0.95);
  border:1px solid rgba(14,165,233,0.4);
  backdrop-filter:blur(16px);
  border-radius:16px;
  padding:16px 24px;
  color:#f8fafc;
  font-weight:700;
  font-size:1.05rem;
  z-index:9999;
  display:flex;align-items:center;gap:12px;
  transform:translateY(100px);opacity:0;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
}
.toast-bar.show{transform:translateY(0);opacity:1}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="bg-canvas">
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
</div>
<div class="grid-lines"></div>

<div class="header-container">
  <h1 class="brand-title">MICROSCOPE TEAM</h1>
  <p class="subtitle">استمارة تسجيل بيانات أعضاء الفريق</p>
</div>

<form class="form-card form-grid" id="memberForm">
  
  <div class="form-group full-width">
    <label for="picture">صورة شخصية (ارفع صورتك) <span class="req">*</span></label>
    <div class="file-dropzone" onclick="document.getElementById('picture').click()">
      <input type="file" id="picture" accept="image/*" required style="display:none" onchange="previewUpload(this)">
      <div id="upload-placeholder" class="upload-placeholder">
        <span class="upload-icon">📸</span>
        <div class="upload-text">اضغط هنا لاختيار صورة من جهازك أو التقاطها</div>
        <div class="upload-hint">PNG, JPG, JPEG (صورة واضحة للوجه)</div>
      </div>
      <div id="upload-preview-box" class="upload-preview-box" style="display:none">
        <img id="upload-preview-img" src="" alt="معاينة الصورة">
        <button type="button" class="btn-change-photo" onclick="event.stopPropagation();document.getElementById('picture').click()">تغيير الصورة 🔄</button>
      </div>
    </div>
  </div>

  <div class="form-group full-width">
    <label for="fullName">الاسم الرباعي (باللغة العربية) <span class="req">*</span></label>
    <input type="text" id="fullName" placeholder="الاسم الرباعي باللغة العربية" required minlength="10">
  </div>

  <div class="form-group full-width">
    <label for="fullNameEn">الاسم باللغة الإنجليزية (Full Name in English) <span class="req">*</span></label>
    <input type="text" id="fullNameEn" placeholder="e.g. Ahmed Mohamed Ali" required minlength="5" style="direction: ltr; text-align: left;">
  </div>

  <div class="form-group">
    <label for="nationalId">الرقم القومي <span class="req">*</span></label>
    <input type="text" id="nationalId" placeholder="14 رقم" pattern="[0-9]{14}" required>
  </div>
  
  <div class="form-group">
    <label for="birthDate">تاريخ الميلاد <span class="req">*</span></label>
    <input type="date" id="birthDate" required>
  </div>

  <div class="form-group">
    <label for="committee">اللجنة (Committee) <span class="req">*</span></label>
    <select id="committee" required>
      <option value="" disabled selected>اختر لجنتك...</option>
      <option value="HR">HR</option>
      <option value="PR">PR</option>
      <option value="PM">PM</option>
      <option value="Scientific">Scientific</option>
      <option value="Social Media">Social Media</option>
      <option value="Charity">خيرية (Charity)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="role">المنصب في اللجنة <span class="req">*</span></label>
    <select id="role" required onchange="toggleHeadCode()">
      <option value="Member" selected>عضو (Member)</option>
      <option value="Head">رئيس لجنة (Head)</option>
    </select>
  </div>

  <div class="form-group" id="headCodeGroup" style="display: none;">
    <label for="headCode">كود التحقق (للمشرفين فقط) <span class="req">*</span></label>
    <input type="password" id="headCode" placeholder="أدخل الكود">
  </div>
  
  <script>
    function toggleHeadCode() {
      const role = document.getElementById('role').value;
      const codeGroup = document.getElementById('headCodeGroup');
      const codeInput = document.getElementById('headCode');
      if (role === 'Head') {
        codeGroup.style.display = 'flex';
        codeInput.required = true;
      } else {
        codeGroup.style.display = 'none';
        codeInput.required = false;
        codeInput.value = '';
      }
    }
  </script>

  <div class="form-group">
    <label for="collegeYear">الفرقة الدراسية <span class="req">*</span></label>
    <select id="collegeYear" required>
      <option value="" disabled selected>اختر الفرقة...</option>
      <option value="الفرقة الأولى">الفرقة الأولى</option>
      <option value="الفرقة الثانية">الفرقة الثانية</option>
      <option value="الفرقة الثالثة">الفرقة الثالثة</option>
      <option value="الفرقة الرابعة">الفرقة الرابعة</option>
      <option value="خريج">خريج</option>
    </select>
  </div>

  <div class="form-group">
    <label for="whatsapp">رقم الواتساب <span class="req">*</span></label>
    <input type="tel" id="whatsapp" placeholder="01xxxxxxxxx" required>
  </div>

  <div class="form-group">
    <label for="phone">رقم آخر إن وجد</label>
    <input type="tel" id="phone" placeholder="01xxxxxxxxx">
  </div>

  <div class="form-group full-width">
    <label for="address">العنوان بالتفصيل <span class="req">*</span></label>
    <input type="text" id="address" placeholder="المحافظة - المركز - الشارع" required>
  </div>

  <div class="form-group">
    <label for="email">البريد الإلكتروني <span class="req">*</span></label>
    <input type="email" id="email" placeholder="example@gmail.com" required>
  </div>

  <div class="form-group">
    <label for="facebook">لينك صفحة الفيسبوك <span class="req">*</span></label>
    <input type="url" id="facebook" placeholder="https://facebook.com/..." required>
  </div>

  <button type="submit" class="btn-submit">حفظ البيانات وإرسالها 🚀</button>

</form>

<!-- ── Success Message ───────────────────────────────────────────────────── -->
<div id="successMessage" class="form-card" style="display: none; text-align: center; padding: 45px 25px; max-width: 520px; margin: 30px auto; border-radius: 20px;">
  <div style="font-size: 3.8rem; margin-bottom: 12px;">✅</div>
  <h2 style="color: #10b981; font-size: 1.85rem; margin-bottom: 8px; font-weight: 800;">تم حفظ البيانات بنجاح!</h2>
  <p style="color: var(--dim); font-size: 1.05rem; line-height: 1.6; margin: 0 0 28px 0;">شكراً لك، لقد تم تسجيل بياناتك بنجاح في النظام وحفظها على Google Drive.</p>

  <!-- Add Another Registration button -->
  <button
    id="addAnotherBtn"
    onclick="resetFormForAnother()"
    style="
      display: inline-flex; align-items: center; gap: 10px;
      padding: 16px 32px; border-radius: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff; border: none; cursor: pointer;
      font-family: var(--font-ar); font-size: 1.1rem; font-weight: 800;
      box-shadow: 0 8px 20px rgba(16,185,129,0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    "
    onmouseover="this.style.transform='translateY(-3px) scale(1.03)';this.style.boxShadow='0 12px 28px rgba(16,185,129,0.55)'"
    onmouseout="this.style.transform='';this.style.boxShadow='0 8px 20px rgba(16,185,129,0.4)'"
  >
    📝 تسجيل عضو آخر
  </button>
</div>

<div class="toast-bar" id="toast">✅ تم حفظ البيانات بنجاح!</div>

<script>
// ── Reset / "Add Another Registration" ──────────────────────────────────────
function resetFormForAnother() {
  // Hide success, show form
  document.getElementById('successMessage').style.display = 'none';
  document.getElementById('memberForm').style.display = 'grid';
  // Scroll to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
  // Reset all form inputs
  document.getElementById('memberForm').reset();
  // Reset upload dropzone
  const placeholder = document.getElementById('upload-placeholder');
  const previewBox = document.getElementById('upload-preview-box');
  const previewImg = document.getElementById('upload-preview-img');
  if (placeholder) placeholder.style.display = 'block';
  if (previewBox) previewBox.style.display = 'none';
  if (previewImg) previewImg.src = '';
  // Reset role-dependent field visibility
  document.getElementById('headCodeGroup').style.display = 'none';
  document.getElementById('headCode').required = false;
  // Re-enable submit button
  const submitBtn = document.querySelector('.btn-submit');
  submitBtn.disabled = false;
  submitBtn.innerHTML = 'حفظ البيانات وإرسالها 🚀';
  submitBtn.style.opacity = '1';
}

function previewUpload(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('upload-placeholder').style.display = 'none';
      document.getElementById('upload-preview-img').src = e.target.result;
      document.getElementById('upload-preview-box').style.display = 'flex';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  // NOTE: We no longer permanently block re-registration from the same device.
  // The "Add Another" button handles new submissions within the same session.
});

document.getElementById('memberForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const fileInput = document.getElementById('picture');
  if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
    alert('يرجى اختيار صورة');
    return false;
  }
  const file = fileInput.files[0];
  
  const submitBtn = document.querySelector('.btn-submit');
  submitBtn.disabled = true;
  submitBtn.innerHTML = 'جاري الحفظ... ⏳';
  submitBtn.style.opacity = '0.7';

  const reader = new FileReader();
  reader.onload = async function(event) {
    const base64String = event.target.result;
    
    let roleVal = document.getElementById('role').value;
    const headCode = document.getElementById('headCode').value;
    if (roleVal === 'Head' && headCode !== '1111') {
      roleVal = 'Member';
    }

    const memberId = Date.now().toString();
    const photoFileName = `photo_${memberId}.jpg`;
    let photoUrl = `${window.location.origin}/web/uploads/members/${photoFileName}?download=1`;

    // Attempt to pre-upload photo to server so it is ready on disk
    try {
      const pRes = await fetch('/api/upload_member_photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          photo_base64: base64String,
          file_name: photoFileName
        })
      });
      const pData = await pRes.json();
      if (pData.success && pData.url) {
        photoUrl = `${window.location.origin}${pData.url}?download=1`;
      }
    } catch(err) {
      console.warn('Pre-upload photo warning:', err);
    }

    const memberData = {
      id: memberId,
      picture: base64String,
      photoUrl: photoUrl,
      fullName: document.getElementById('fullName').value.trim(),
      fullNameEn: document.getElementById('fullNameEn').value.trim(),
      nationalId: document.getElementById('nationalId').value.trim(),
      birthDate: document.getElementById('birthDate').value.trim(),
      committee: document.getElementById('committee').value.trim(),
      role: roleVal,
      phone: document.getElementById('phone').value.trim(),
      whatsapp: document.getElementById('whatsapp').value.trim(),
      address: document.getElementById('address').value.trim(),
      collegeYear: document.getElementById('collegeYear').value.trim(),
      email: document.getElementById('email').value.trim(),
      facebook: document.getElementById('facebook').value.trim(),
      timestamp: new Date().toLocaleString('ar-EG', { timeZone: 'Africa/Cairo' })
    };

    // ── Show success message immediately ──────────────────────────────────
    document.getElementById('memberForm').style.display = 'none';
    document.getElementById('successMessage').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });

    // ── STEP 1: SAVE TO FIREBASE IMMEDIATELY ──────────────────────────────
    // This happens BEFORE PDF generation so data is ALWAYS saved even if
    // the PDF generation or Drive upload fails for any reason.
    const memberDataForServer = { ...memberData };
    delete memberDataForServer.picture; // strip large base64 — photoUrl is kept
    try {
      const quickSave = await fetch('/api/register_member', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ member_data: memberDataForServer })
      });
      const quickSaveData = await quickSave.json();
      if (quickSaveData.success) {
        console.log('✅ Saved to Firebase instantly. ID:', quickSaveData.firebase_id);
      } else {
        console.error('❌ Firebase save error:', quickSaveData.error);
      }
    } catch(saveErr) {
      console.error('❌ Firebase save API failed:', saveErr);
    }

    // Format URLs for clickable PDF links
    let fbUrl = memberData.facebook ? memberData.facebook.trim() : '';
    if (fbUrl && !fbUrl.startsWith('http://') && !fbUrl.startsWith('https://')) {
      fbUrl = 'https://' + fbUrl;
    }

    let waNum = memberData.whatsapp.replace(/\D/g, '');
    if (waNum.startsWith('01')) waNum = '2' + waNum;
    const waUrl = waNum ? `https://wa.me/${waNum}` : '';

    // Render card in offscreen container for Backup Channel PDF
    const offscreen = document.createElement('div');
    offscreen.style.position = 'fixed';
    offscreen.style.top = '0';
    offscreen.style.left = '0';
    offscreen.style.width = '700px';
    offscreen.style.zIndex = '-99999';
    offscreen.style.background = '#ffffff';
    offscreen.style.color = '#0f172a';
    offscreen.style.padding = '30px 25px';
    offscreen.style.fontFamily = 'Cairo, sans-serif';
    offscreen.style.direction = 'rtl';
    offscreen.style.boxSizing = 'border-box';
    offscreen.innerHTML = `
      <div style="text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 18px; margin-bottom: 18px;">
        <div style="font-size: 1.3rem; font-weight: 900; color: #1e3a8a;">🔬 MICROSCOPE TEAM</div>
        <div style="font-size: 0.85rem; color: #64748b; font-weight: bold; margin-top: 2px;">بيانات عضو الفريق الرسمية</div>
        <div style="margin: 15px 0;">
          <a id="pdfAvatarLink" href="${photoUrl}" target="_blank" style="display: inline-block;">
            <img src="${memberData.picture}" alt="Profile" style="width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid #3b82f6; display: inline-block;">
          </a>
        </div>
        <h1 style="color: #0f172a; font-size: 1.6rem; margin: 0 0 2px 0; font-weight: 800;">${memberData.fullName}</h1>
        <div style="color: #64748b; font-size: 1.05rem; margin: 0 0 6px 0; font-weight: 600; font-family: sans-serif;">${memberData.fullNameEn || ''}</div>
        <h3 style="color: #2563eb; font-size: 1.2rem; margin: 0; font-weight: 700;">${(memberData.role === 'Head' ? 'Head ' : '') + memberData.committee + ' Commit'}</h3>
      </div>

      <table style="width: 100%; border-collapse: collapse; font-size: 0.95rem;">
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; width: 35%; background: #f8fafc;">الاسم بالإنجليزية</th><td style="padding: 9px 12px; font-weight: bold; color: #0f172a; font-family: sans-serif;">${memberData.fullNameEn || '-'}</td></tr>
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">الرقم القومي</th><td style="padding: 9px 12px; font-weight: bold; color: #0f172a;">${memberData.nationalId}</td></tr>
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">تاريخ الميلاد</th><td style="padding: 9px 12px; font-weight: bold; color: #0f172a;">${memberData.birthDate || '-'}</td></tr>
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">المنصب</th><td style="padding: 9px 12px; font-weight: bold; color: #0f172a;">${memberData.role === 'Head' ? 'رئيس لجنة (Head)' : 'عضو (Member)'}</td></tr>
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">اللجنة</th><td style="padding: 9px 12px; font-weight: bold; color: #0f172a;">${memberData.committee}</td></tr>
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">الفرقة الدراسية</th><td style="padding: 9px 12px; font-weight: bold; color: #0f172a;">${memberData.collegeYear}</td></tr>
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">رقم الواتساب</th><td style="padding: 9px 12px; font-weight: bold; color: #0f172a;"><a id="pdfWaLink" href="${waUrl || '#'}" target="_blank" style="color: #0f172a; text-decoration: none;">${memberData.whatsapp}</a></td></tr>
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">الهاتف / رقم آخر</th><td style="padding: 9px 12px; font-weight: bold; color: #0f172a;">${memberData.phone || '-'}</td></tr>
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">البريد الإلكتروني</th><td style="padding: 9px 12px; font-weight: bold; color: #0f172a; word-break: break-all;">${memberData.email || '-'}</td></tr>
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">العنوان</th><td style="padding: 9px 12px; font-weight: bold; color: #0f172a;">${memberData.address || '-'}</td></tr>
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">حساب الفيسبوك</th><td style="padding: 9px 12px; color: #2563eb; word-break: break-all;"><a id="pdfFbLink" href="${fbUrl || '#'}" target="_blank" style="color: #2563eb; text-decoration: underline; font-weight: bold; display: inline-block;">${memberData.facebook || '-'}</a></td></tr>
        <tr style="border-bottom: 1px solid #e2e8f0;"><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">رابط الصورة الشخصية</th><td style="padding: 9px 12px; color: #2563eb; word-break: break-all;"><a id="pdfPhotoLink" href="${photoUrl}" target="_blank" style="color: #2563eb; text-decoration: underline; font-weight: bold; display: inline-block;">📥 عرض وتحميل الصورة الأصلية</a><div style="font-size: 0.72rem; color: #64748b; margin-top: 3px; font-family: monospace; word-break: break-all;">${photoUrl}</div></td></tr>
        <tr><th style="text-align: right; padding: 9px 12px; color: #475569; background: #f8fafc;">تاريخ التسجيل</th><td style="padding: 9px 12px; color: #64748b; font-size: 0.85rem;">${memberData.timestamp}</td></tr>
      </table>

      <div style="text-align: center; margin-top: 18px; padding-top: 10px; border-top: 1px dashed #cbd5e1; color: #94a3b8; font-size: 0.8rem;">
        Microscope Team Official Record • تم تسجيل وحفظ البيانات بنجاح
      </div>
    `;

    document.body.appendChild(offscreen);

    // Wait for profile picture to load
    const imgEl = offscreen.querySelector('img');
    if (imgEl) {
      if (!imgEl.complete) {
        await new Promise(r => { imgEl.onload = r; imgEl.onerror = r; });
      }
      if (imgEl.decode) {
        try { await imgEl.decode(); } catch(e) {}
      }
    }

    // Delay to guarantee font rendering and layout calculation
    await new Promise(r => setTimeout(r, 500));

    try {
      const canvas = await html2canvas(offscreen, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#ffffff',
        width: 700,
        windowWidth: 700,
        scrollY: 0,
        scrollX: 0
      });

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgMarginX = 10;
      const imgMarginY = 10;
      const imgWidth = pageWidth - (imgMarginX * 2);
      const imgHeight = (canvas.height * imgWidth) / canvas.width;

      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', imgMarginX, imgMarginY, imgWidth, Math.min(imgHeight, pageHeight - (imgMarginY * 2)));

      // Calculate interactive links inside the PDF
      const offscreenRect = offscreen.getBoundingClientRect();
      const pdfScale = imgWidth / offscreen.offsetWidth;

      function attachPdfLink(elementId, targetUrl) {
        if (!targetUrl || targetUrl === '-' || targetUrl === '#') return;
        const targetEl = offscreen.querySelector('#' + elementId);
        if (!targetEl) return;
        const targetRect = targetEl.getBoundingClientRect();
        const linkX = imgMarginX + ((targetRect.left - offscreenRect.left) * pdfScale);
        const linkY = imgMarginY + ((targetRect.top - offscreenRect.top) * pdfScale);
        const linkW = targetRect.width * pdfScale;
        const linkH = targetRect.height * pdfScale;
        if (linkW > 0 && linkH > 0) {
          pdf.link(linkX, linkY, linkW, linkH, { url: targetUrl });
        }
      }

      attachPdfLink('pdfFbLink', fbUrl);
      attachPdfLink('pdfPhotoLink', photoUrl);
      attachPdfLink('pdfAvatarLink', photoUrl);
      if (waUrl) attachPdfLink('pdfWaLink', waUrl);

      if (offscreen.parentNode) {
        document.body.removeChild(offscreen);
      }

      const pdfBase64 = pdf.output('datauristring');

      // ── STEP 2: Upload PDF to Google Drive ────────────────────────────────
      // Firebase was already saved above (before PDF generation).
      // This call uploads the PDF to Drive only. The server skips Firebase
      // if member_data is sent again (PUT is idempotent with the same ID).
      try {
        const regRes = await fetch('/api/register_member', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            file_name: `Member_${memberData.fullName.replace(/\s+/g, '_')}.pdf`,
            file_base64: pdfBase64
            // Note: member_data intentionally omitted here to avoid re-saving
          })
        });
        const regData = await regRes.json();
        if (regData.success) {
          console.log('✅ PDF uploaded to Google Drive. Drive ID:', regData.drive_file_id);
        } else {
          console.error('⚠️ Drive upload error (data already saved to Firebase):', regData.error);
        }
      } catch(apiErr) {
        console.error('⚠️ Drive upload failed (data already saved to Firebase):', apiErr);
      }

    } catch(err) {
      console.error('PDF Generation Error:', err);
      if (offscreen.parentNode) {
        document.body.removeChild(offscreen);
      }
    }

    return false;
  };

  reader.readAsDataURL(file);
});
</script>

</body>
</html>
